---
- name: Setup target machine
  become: false
  hosts: all
  vars:
    remote_folder: '{{ _remote_folder }}'
    project_name: '{{ _project_name }}'
    project_stage: '{{ _project_stage }}'

  tasks:
    - name: Ensure target directory exists
      file:
        path: '{{ remote_folder }}'
        state: directory
        mode: '0755'
        owner: '{{ ansible_user }}'
        group: '{{ ansible_user }}'

    - name: Ensure workout data directory exists
      file:
        path: '{{ remote_folder }}/workout-data'
        state: directory
        # Health data: only the deploy user (the container's user) may read it.
        mode: '0700'
        owner: '{{ ansible_user }}'
        group: '{{ ansible_user }}'

    # Setup base docker compose with templates
    # Uses: project_name & project_stage
    - name: Setup base docker compose file
      template:
        src: ../docker/docker-compose.base.yml.j2
        dest: "{{ remote_folder }}/docker-compose.base.yml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'
