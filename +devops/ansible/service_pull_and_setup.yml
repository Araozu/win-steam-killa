---
- name: Checks the local workout image and writes its version file
  become: false
  hosts: all
  vars:
    remote_folder: '{{ _remote_folder }}'
    image_tag: '{{ _image_tag }}'
    full_registry_url: '{{ _full_registry_url }}'
    project_name: '{{ _project_name }}'
    project_service: '{{ _project_service }}'
    project_stage: '{{ _project_stage }}'

  tasks:
    - name: Verify the build image is available to the deployment Docker daemon
      command: docker image inspect {{ full_registry_url }}:{{ image_tag }} --format '{% raw %}{{.Id}}{% endraw %}'
      changed_when: false

    - name: Create .version file
      copy:
        content: |
          # Generated by Ansible on {{ ansible_date_time.iso8601 }}
          # Environment: {{ project_stage }}
          # Build: {{ image_tag }}

          # Service version
          {{ project_name | upper }}_{{ project_service | upper }}_VERSION={{ image_tag }}
          {{ project_name | upper }}_{{ project_service | upper }}_REGISTRY_URL={{ full_registry_url }}
        dest: '{{ remote_folder }}/.version.{{ project_service }}'
        owner: '{{ ansible_user }}'
        group: '{{ ansible_user }}'
        mode: '0600'

    # .env.workout is managed manually over SSH, never written by Ansible.
    # Create it once on the server: /home/docker_admin/steamtimer-develop/.env.workout
    # See +develop/.env.workout.example for the required keys.
    - name: Check .env.workout exists (managed manually over SSH)
      stat:
        path: '{{ remote_folder }}/.env.workout'
      register: env_file

    - name: Fail if .env.workout is missing
      fail:
        msg: ".env.workout missing at {{ remote_folder }}/.env.workout. SSH in and create it from +develop/.env.workout.example."
      when: not env_file.stat.exists
