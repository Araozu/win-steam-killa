---
- name: Pulls docker image and writes necessary .version/.env files
  become: false
  hosts: all
  vars:
    remote_folder: '{{ _remote_folder }}'
    image_tag: '{{ _image_tag }}'
    full_registry_url: '{{ _full_registry_url }}'
    project_name: '{{ _project_name }}'
    project_service: '{{ _project_service }}'
    project_stage: '{{ _project_stage }}'

  tasks:
    - name: Create .version file
      copy:
        content: |
          # Generated by Ansible on {{ ansible_date_time.iso8601 }}
          # Environment: {{ project_stage }}
          # Build: {{ image_tag }}

          # Service version
          {{ project_name | upper }}_{{ project_service | upper }}_VERSION={{ image_tag }}
          {{ project_name | upper }}_{{ project_service | upper }}_REGISTRY_URL={{ full_registry_url }}
        dest: '{{ remote_folder }}/.version.{{ project_service }}'
        owner: '{{ ansible_user }}'
        group: '{{ ansible_user }}'
        mode: '0600'

    - name: Create .env.workout file from vault
      copy:
        content: |
          # Generated by Ansible on {{ ansible_date_time.iso8601 }}
          STRAVA_CLIENT_ID={{ workout_strava_client_id }}
          STRAVA_CLIENT_SECRET={{ workout_strava_client_secret }}
          STRAVA_REDIRECT_URI={{ workout_strava_redirect_uri }}
          API_TOKEN={{ workout_api_token }}
          USER_TIMEZONE={{ workout_user_timezone | default('America/Santiago') }}
          DATA_DIR=/data
          POLL_INTERVAL_MINUTES={{ workout_poll_minutes | default('5') }}
          WORKOUT_MULTIPLIER={{ workout_multiplier | default('4') }}
          MIN_WORKOUT_SECONDS={{ workout_min_seconds | default('600') }}
          MAX_DOTA_SECONDS={{ workout_max_dota | default('14400') }}
          COUNT_MANUAL={{ workout_count_manual | default('false') }}
        dest: '{{ remote_folder }}/.env.workout'
        owner: '{{ ansible_user }}'
        group: '{{ ansible_user }}'
        mode: '0600'
        force: true
