name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - if: runner.os == 'Windows'
        run: dotnet build SteamTimer.slnx -c Release
      - if: runner.os != 'Windows'
        run: dotnet build Tests/Tests.csproj -c Release
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet publish App/App.csproj -c Release -r win-x64 --self-contained false -o "$env:RUNNER_TEMP/steam-timer-app"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "$env:RUNNER_TEMP/steam-timer-app/App.pri")) { throw 'Missing App.pri' }
      - run: dotnet test Tests/Tests.csproj -c Release --no-build
      - shell: pwsh
        run: ./Tests/VerifySetup.ps1
