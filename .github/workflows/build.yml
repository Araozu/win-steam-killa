name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - run: dotnet build SteamTimer.slnx -c Release
      - run: dotnet test Tests/Tests.csproj -c Release --no-build
      - shell: pwsh
        run: ./Tests/VerifySetup.ps1
